name: 'fedramp_20x'
version: '0.0.1'
require-dbt-version: [">=1.3.0", "<2.0.0"]
config-version: 2

model-paths: ["models"]
analysis-paths: []
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  fedramp_20x:
    fedramp_ksis:
      +materialized: table
    k8s_container_images:
      +materialized: table

vars:
  iac_tagging_scheme:
    key: ""
    values: []
  ksi_cmt_02_tables:
    - "aws_s3_buckets"
    - "aws_elasticache_clusters"
    - "aws_rds_clusters"
    - "aws_rds_instances"
    - "aws_ec2_vpcs"
